name: Android and API

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'lib/**'
      - 'app/api/mobile/**'
      - 'tests/**'
      - 'package*.json'

permissions:
  contents: read

jobs:
  android:
    name: Build native Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests, lint and native APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug 2>&1 | tee build.log
      - name: Surface compiler errors in checks
        if: failure()
        working-directory: .
        shell: python
        run: |
          import re, pathlib
          p = pathlib.Path('android/build.log')
          text = p.read_text() if p.exists() else 'Build failed before Gradle started. Check Android SDK installation.'
          lines = [line for line in text.splitlines() if line.startswith('e:') or 'FAILURE:' in line or 'What went wrong:' in line or 'SDK location not found' in line]
          for line in lines[:45]:
              match = re.search(r'file:///(.*?):(\d+):(\d+)\s*(.*)', line)
              if match:
                  file, row, col, message = match.groups()
                  file = 'android/' + file.split('/android/', 1)[-1]
                  print(f'::error file={file},line={row},col={col}::{message[:900]}')
              else:
                  print('::error::' + line[:900].replace('%', '%25').replace('\n', '%0A'))
          print('### Build failure\n```\n' + '\n'.join(text.splitlines()[-70:]) + '\n```')
      - name: No embedded web application
        working-directory: .
        run: |
          if grep -REn 'import android\.webkit|WebView\(|BridgeWebView|org\.apache\.cordova|com\.getcapacitor' android/app/src/main/java; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: iwannalearn-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore

  api:
    name: Check the shared backend
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
